name: Capture social sharing images (one-time)
on:
  push:
    branches: [feat/real-screenshot-og-images-20261030]
    paths:
      - .github/workflows/capture-social-preview-once.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser and image tools
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
      - name: Capture actual first screen at 1200 x 630
        env:
          TARGET_URL: 'https://talentlens.adryanrizkyalviano.me/'
        run: |
          python - <<'PY'
          import os
          from PIL import Image
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={'width': 2047, 'height': 1160}, device_scale_factor=1)
              response = page.goto(os.environ['TARGET_URL'], wait_until='domcontentloaded', timeout=60000)
              if not response or response.status >= 400:
                  raise RuntimeError(f'Website response: {response.status if response else "none"}')
              page.wait_for_timeout(4500)
              page.screenshot(path='/tmp/og-first-view.png', full_page=False, animations='disabled')
              browser.close()
          im = Image.open('/tmp/og-first-view.png').convert('RGB')
          w, h = im.size
          target_h = round(w * 630 / 1200)
          im = im.crop((0, 0, w, target_h)).resize((1200, 630), Image.Resampling.LANCZOS)
          for path in ('app/opengraph-image.png', 'app/twitter-image.png'):
              im.save(path, 'PNG', optimize=True)
              print(path, os.path.getsize(path))
          PY
      - name: Commit captured social images and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/capture-social-preview-once.yml
          git add app/opengraph-image.png app/twitter-image.png
          git commit -m 'feat: use authentic TalentLens first-screen social thumbnails'
          git push origin HEAD:feat/real-screenshot-og-images-20261030
