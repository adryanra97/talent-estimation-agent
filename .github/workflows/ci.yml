name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --all-packages --extra dev
      - name: Lint
        run: uv run ruff check src api tests && uv run ruff format --check src api tests
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q
      - name: Evaluation pipeline (demo case)
        working-directory: evaluation
        run: uv run kedro run

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
